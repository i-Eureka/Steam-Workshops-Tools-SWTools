name: Build and Publish Beta Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.8-beta.1)"
        required: true
        default: "v2.0.8-beta.1"
      project_path:
        description: "Path to .csproj"
        required: false
        default: ""
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Detect project file
        id: detect
        shell: pwsh
        run: |
          $inputPath = "${{ github.event.inputs.project_path }}"
          if (![string]::IsNullOrWhiteSpace($inputPath) -and (Test-Path $inputPath)) {
            $proj = Resolve-Path $inputPath
          } else {
            $projects = Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }
            if ($projects.Count -eq 0) { throw "No .csproj found." }
            if ($projects.Count -gt 1) {
              Write-Host "Found multiple projects:"
              $projects | ForEach-Object { Write-Host $_.FullName }
              throw "Multiple .csproj files found. Re-run workflow and set project_path."
            }
            $proj = $projects[0].FullName
          }
          "project=$proj" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using project: $proj"

      - name: Restore
        run: dotnet restore "${{ steps.detect.outputs.project }}"

      - name: Build
        run: dotnet build "${{ steps.detect.outputs.project }}" -c "${{ github.event.inputs.configuration }}" --no-restore

      - name: Publish win-x64
        id: pack
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "publish-win-x64"
          dotnet publish "${{ steps.detect.outputs.project }}" `
            -c "${{ github.event.inputs.configuration }}" `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=false `
            -o $outDir
          if (!(Test-Path $outDir)) { throw "Publish output not found: $outDir" }
          $zipName = "Steam-Workshops-Tools-SWTools-${{ github.event.inputs.tag }}-win-x64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path (Join-Path $outDir "*") -DestinationPath $zipPath -Force
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create/Update pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          target_commitish: master
          name: ${{ github.event.inputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.pack.outputs.zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
