name: Build and Publish Beta Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.8-beta.1)"
        required: true
        default: "v2.0.8-beta.1"
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      # 你的可执行程序项目（WPF 启动项目）
      PROJECT_PATH: SWTools.WPF/SWTools.WPF.csproj
      RUNTIME_ID: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify project path
        shell: pwsh
        run: |
          if (!(Test-Path "${{ env.PROJECT_PATH }}")) {
            throw "Project not found: ${{ env.PROJECT_PATH }}"
          }
          Write-Host "Using project: ${{ env.PROJECT_PATH }}"

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" -c "${{ github.event.inputs.configuration }}" --no-restore

      - name: Publish (framework-dependent, multi-file)
        id: pack
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "publish"
          dotnet publish "${{ env.PROJECT_PATH }}" `
            -c "${{ github.event.inputs.configuration }}" `
            -r "${{ env.RUNTIME_ID }}" `
            --self-contained false `
            -p:PublishSingleFile=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o $publishDir

          if (!(Test-Path (Join-Path $publishDir "SWTools.exe"))) {
            Write-Host "Published files:"
            Get-ChildItem $publishDir | Select-Object Name | Format-Table -AutoSize
            throw "SWTools.exe not found in publish output."
          }

          $zipName = "SWTools-${{ github.event.inputs.tag }}-win-x64.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path (Join-Path $publishDir "*") -DestinationPath $zipPath -Force

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Packaged: $zipPath"

      - name: Create/Update pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          target_commitish: master
          name: ${{ github.event.inputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.pack.outputs.zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
